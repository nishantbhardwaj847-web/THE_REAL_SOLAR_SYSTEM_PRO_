<!DOCTYPE html>
<html>
<head>
    <title>Earth & Time Perfect Sync</title>
    <style>
        body { margin: 0; height: 100vh; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; perspective: 2000px; font-family: 'Segoe UI', sans-serif; }
        
        #time-block { position: absolute; top: 20px; left: 20px; background: rgba(0, 0, 0, 0.9); border: 1px solid #00c8ff; padding: 15px; border-radius: 10px; color: #fff; z-index: 100; min-width: 180px; box-shadow: 0 0 15px rgba(0, 200, 255, 0.3); }
        .counter-row { display: flex; justify-content: space-between; margin-bottom: 2px; align-items: baseline; }
        .counter-val { font-size: 22px; font-weight: bold; font-family: monospace; }
        .ms-val { color: #ffcc00; font-size: 18px; }
        .label { font-size: 10px; color: #00c8ff; text-transform: uppercase; font-weight: bold; }

        #universe { position: relative; width: 100vw; height: 100vh; transform-style: preserve-3d; transform: rotateX(65deg); }
        
        /* Fixed Circular Orbits */
        .galaxy-orbit {
            position: absolute; top: 50%; left: 50%; width: 950px; height: 950px;
            border: 1px dashed rgba(255, 255, 255, 0.1); border-radius: 50%;
            transform: translate(-50%, -50%); transform-style: preserve-3d;
        }

        .sun-system-node { position: absolute; top: 50%; right: -45px; transform-style: preserve-3d; }

        .sun { 
            width: 90px; height: 90px; 
            background: radial-gradient(circle, #fff 0%, #ffcc00 50%, #ff4500 100%); 
            border-radius: 50%; box-shadow: 0 0 80px #ff4500; 
            transform: translate(-50%, -50%) rotateX(-65deg); 
        }

        .earth-orbit { 
            position: absolute; top: 50%; left: 50%; width: 460px; height: 460px; 
            border: 1.5px solid rgba(0, 200, 255, 0.2); border-radius: 50%; 
            transform: translate(-50%, -50%); transform-style: preserve-3d; 
        }
        
        .earth-node { position: absolute; top: 50%; right: -21px; transform-style: preserve-3d; }

        .earth { 
            width: 42px; height: 42px; 
            background-color: #1a4d8a;
            background-image: url('https://upload.wikimedia.org/wikipedia/commons/b/bb/Equirectangular_projection_SW.jpg'); 
            background-size: cover; border-radius: 50%; 
            box-shadow: inset 12px 0 18px rgba(0,0,0,0.6), 0 0 10px rgba(0, 162, 255, 0.4);
            transform-style: preserve-3d;
        }

        .moon-orbit { 
            position: absolute; top: 50%; left: 50%; width: 85px; height: 85px; 
            border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 50%; 
            transform: translate(-50%, -50%); transform-style: preserve-3d; 
        }
        .moon { 
            position: absolute; top: 50%; right: -5px; width: 10px; height: 10px; 
            background: #d1d1d1; border-radius: 50%; box-shadow: inset -3px -3px 6px #000; 
        }

        .stars { position: absolute; width: 200%; height: 200%; background: url('https://www.transparenttextures.com/patterns/stardust.png') repeat; opacity: 0.3; z-index: -1; }
    </style>
</head>
<body>

    <div id="time-block">
        <div class="counter-row"><span id="day-count" class="counter-val">00</span><span class="label">Days</span></div>
        <div class="counter-row"><span id="hour-count" class="counter-val">00</span><span class="label">Hours</span></div>
        <div class="counter-row"><span id="min-count" class="counter-val">00</span><span class="label">Mins</span></div>
        <div class="counter-row"><span id="sec-count" class="counter-val">00</span><span class="label">Secs</span></div>
        <div class="counter-row"><span id="ms-count" class="counter-val ms-val">000</span><span class="label">M-Sec</span></div>
    </div>

    <div class="stars"></div>
    <div id="universe">
        <div id="galaxy-orbit-el" class="galaxy-orbit">
            <div class="sun-system-node">
                <div id="sun-model" class="sun"></div>
                <div id="earth-orbit-el" class="earth-orbit">
                    <div class="earth-node">
                        <div id="moon-orbit-el" class="moon-orbit">
                            <div class="moon"></div>
                        </div>
                        <div id="earth-model" class="earth"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Speed ko 150 kar diya hai - Relaxed aur clear sync dikhega
        const speedMultiplier = 150; 
        let totalMs = 0;

        const galaxyOrbitEl = document.getElementById('galaxy-orbit-el');
        const earthOrbitEl = document.getElementById('earth-orbit-el');
        const moonOrbitEl = document.getElementById('moon-orbit-el');
        const earthModel = document.getElementById('earth-model');
        const sunModel = document.getElementById('sun-model');

        function animate() {
            // Har frame par totalMs badhega (Time calculation)
            totalMs += (16.67 * speedMultiplier);
            
            // Logic for Timer Display
            let d = Math.floor(totalMs / 86400000);
            let h = Math.floor((totalMs % 86400000) / 3600000);
            let m = Math.floor((totalMs % 3600000) / 60000);
            let s = Math.floor((totalMs % 60000) / 1000);
            let ms = Math.floor(totalMs % 1000);

            // Display Update
            document.getElementById('day-count').innerText = d.toString().padStart(2, '0');
            document.getElementById('hour-count').innerText = h.toString().padStart(2, '0');
            document.getElementById('min-count').innerText = m.toString().padStart(2, '0');
            document.getElementById('sec-count').innerText = s.toString().padStart(2, '0');
            document.getElementById('ms-count').innerText = ms.toString().padStart(3, '0');

            // --- THE SYNC LOGIC ---
            
            // 1. Earth Spin: 360 deg in exactly 24 hours (86,400,000 ms)
            // Ye formula ensure karta hai ki Earth utna hi ghoome jitna ghanta counter dikha raha hai.
            let dayFraction = (totalMs % 86400000) / 86400000;
            let earthSpin = dayFraction * 360;
            earthModel.style.transform = `rotateX(-65deg) rotateY(${earthSpin}deg)`;

            // 2. Earth Orbit Around Sun (365.25 Days)
            let orbitFraction = (totalMs % (365.25 * 86400000)) / (365.25 * 86400000);
            let earthMove = orbitFraction * 360;
            earthOrbitEl.style.transform = `translate(-50%, -50%) rotateZ(${earthMove}deg)`;

            // 3. Moon Orbit (27.3 Days)
            let moonFraction = (totalMs % (27.3 * 86400000)) / (27.3 * 86400000);
            let moonMove = moonFraction * 360;
            moonOrbitEl.style.transform = `translate(-50%, -50%) rotateZ(${moonMove}deg)`;

            // 4. Galaxy Movement (Extremely slow)
            let galaxyMove = (totalMs / (2000 * 86400000)) * 360;
            galaxyOrbitEl.style.transform = `translate(-50%, -50%) rotateZ(${galaxyMove}deg)`;

            requestAnimationFrame(animate);
        }

        requestAnimationFrame(animate);

        // Universe Drag
        let rx = 65, rz = 0, isDown = false, lx, ly;
        document.onmousedown = (e) => { isDown = true; lx = e.clientX; ly = e.clientY; };
        document.onmouseup = () => isDown = false;
        document.onmousemove = (e) => {
            if(!isDown) return;
            rz += (e.clientX - lx) * 0.3;
            rx -= (e.clientY - ly) * 0.3;
            rx = Math.max(10, Math.min(88, rx));
            document.getElementById('universe').style.transform = `rotateX(${rx}deg) rotateZ(${rz}deg)`;
            sunModel.style.transform = `translate(-50%, -50%) rotateX(${-rx}deg)`; 
            lx = e.clientX; ly = e.clientY;
        };
    </script>
</body>
</html>
